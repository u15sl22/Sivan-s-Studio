version: "3.8"

services:
  sivan-studio:
    build:
      context: .
    container_name: sivan-studio
    network_mode: host
    restart: unless-stopped
    init: true

    env_file:
      - .env.production

    volumes:
      - ./data:/app/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8766/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
